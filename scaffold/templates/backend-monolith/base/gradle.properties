# ── Gradle 构建参数 ──────────────────────────────────────
# 只在「根项目目录」（含 settings.gradle.kts 的目录）生效。
# 禁用守护进程：每次构建起单次 JVM，构建结束即退出，环境变量与内存参数改动立即生效。
# 需要常驻进程时用命令行开关覆盖：./gradlew --daemon ...
org.gradle.daemon=false

# ── 质量门禁（覆盖率与 CRAP）───────────────────────────────
# 覆盖率下限（0~1 的比值）：低于此值 ./gradlew build 直接失败（jacocoTestCoverageVerification）。
# 底座实测（单元与契约测试，默认排除集成测试）：6 种组合的行覆盖 70.6%~72.5%（mongodb 最低）、
# 分支覆盖 74.1%，89 个方法里最高 CRAP 6.1。默认下限比实测最低值留约 5 个百分点余量；
# 删掉 sample 占位上下文后骨架自身行覆盖是 87.5%，接入真实业务代码后按项目实际水平调高这两项。
coverageLineMin=0.65
coverageBranchMin=0.65
# 单方法 CRAP 分数上限（crap4j 的惯例阈值就是 30）：骨架实测 89 个方法里最高 6.1，余量充足。
# 分数越高 = 圈复杂度越高且越缺测试；实测一个圈复杂度 9、零覆盖的方法得 90 分。
crapMax=30

# ── 变异测试（可选门禁，不参与 build）─────────────────────
# 阈值只被 scripts/mutation-gate.sh 读取；日常 ./gradlew build 不跑变异测试。
# 存活变异体上限：允许在「被变异的类」里存活的变异体数，超过即门禁失败（0 = 一个都不许活）。
mutationSurvivorsMax=0
# 变异得分下限（0~1）：低于此值即门禁失败；0 表示不按分数判定，只按存活数判定。
mutationScoreMin=0.0
# 被变异类里出现「零覆盖」变异体时是否判失败（true = 未覆盖的代码也算门禁失败）。
mutationFailOnNoCoverage=true
